syntax = "proto3";
option go_package = "../opService";
import "google/protobuf/empty.proto";
message TemplateDataItem {
  string value = 1;
  string color = 2;
}

// templateID:模板 ID
// data first:标题
//      keynote1:值
//      keynote2:值
//      keynote3:值
//      ...
//      remark:备注
// toMail 用户邮箱
// url:外部链接
// toUserID op 用户 ID
message MessageRequest {
  string templateID = 1;
  map<string, TemplateDataItem> data = 2; 
  string url = 3;
  int64 toUserID = 4;
  string toLogin= 5;
}

// code:0 返回正确
//      > 0 错误
// message 错误消息
message Result {
  int64 code = 1;
  string message = 2;
}

message Template {
  string title = 1;
  string templateID = 2;
  string body = 3;
  string trade = 4;
}

message GetTemplateResp {
  repeated Template templates = 1;
}

message RespUser {
  string mail = 1;
}

message GetUserInfoByCodeReq {
  string code = 1;
}

message WorkerMessageReq {
  int64 toUserID = 1;
  string title = 2;
  string description = 3;
  string url = 4;
  string buttonText = 5;
}

message SendImageReq {
  int64 toUserID = 1;
  string imageUrl = 2;
}

message ReportForm {
  int64 ID = 1;
  int64 ReportProjectID = 2;
  string Type = 3;
  string Subject = 4;
  string Status = 5;
  string StartTime = 6;
  string EndTime = 7;
  string Duration = 8;
  string Remarks = 9;
  int64 ParentID = 10;
}

message GetPdfReq {
  repeated ReportForm Data = 1;
  string Email = 2;
}

message GetPdfResp {
  string url = 1;
}

message PlmProjectReq {
  int64 ProjectID = 1;
}

message ShowEstimateButtonResp {
  // 概算按钮是否显示
  bool show = 1;
}

message GetUpdateMilestoneProjectReq {
  int64 UserID = 1;
}

message GetUpdateMilestoneProjectResp {
  repeated int64 projectIds = 1;
  // 总数
  int64 total = 2;
}

message GetArchiveProjectsReq {
  int64 UserID = 1;
}

message GetArchiveProjectsResp {
  repeated int64 projectIds = 1;
  // url
  string url = 2;
  // 总数
  int64 total = 3;
}

message GetBudgetOverrunProjectsReq {
  int64 UserID = 1;
}

message GetBudgetOverrunProjectsResp {
  // 是否显示
  bool show = 1;
  repeated int64 projectIds = 2;
  // 总数
  int64 total = 3;
}

message SyncTimeEntriesReq {
  int64 UserID = 1;
  string spentOn = 2;
}

message SyncTimeEntriesResp {
  bool success = 1;
}
service OpService {
  rpc SendMessage(MessageRequest) returns(Result);
  rpc GetTemplates(google.protobuf.Empty) returns(GetTemplateResp);
  rpc GetUserInfoByCode(GetUserInfoByCodeReq) returns(RespUser);
  rpc SendWcWorkerMessage(WorkerMessageReq) returns(Result);
  rpc SendImage(SendImageReq) returns(Result);
  rpc GetPdf(GetPdfReq) returns(GetPdfResp);
  rpc ShowEstimateButton(PlmProjectReq) returns(ShowEstimateButtonResp);
  // 待更新里程碑的项目 https://plm.thape.com.cn/projects/plmwenti/work_packages/391927/activity
  rpc GetUpdateMilestoneProject(GetUpdateMilestoneProjectReq) returns(GetUpdateMilestoneProjectResp);
  // 待归档的项目列表 https://plm.thape.com.cn/projects/plmwenti/work_packages/391927/activity
  rpc GetArchiveProjects(GetArchiveProjectsReq) returns(GetArchiveProjectsResp);
  // 预算超支的项目 https://plm.thape.com.cn/projects/plmwenti/work_packages/391927/activity
  rpc GetBudgetOverrunProjects(GetBudgetOverrunProjectsReq) returns(GetBudgetOverrunProjectsResp);
  //老系统创建工时数据同步
  rpc SyncTimeEntries(SyncTimeEntriesReq) returns(SyncTimeEntriesResp);
}
